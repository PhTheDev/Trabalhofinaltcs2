# Nota: Para executar a stack completa (Postgres + Backend + Frontend + Mobile), use o docker-compose.yml na raiz:
#   docker compose up --build
# Este arquivo abaixo permanece caso queira rodar apenas o banco PostgreSQL isoladamente.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brincando
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brincando"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
